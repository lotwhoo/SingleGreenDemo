name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - codex/internal-debug
  push:
    branches:
      - main
      - codex/internal-debug

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  impact-plan:
    name: Plan CI impact
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      run_packages: ${{ steps.plan.outputs.run_packages }}
      package_matrix: ${{ steps.plan.outputs.package_matrix }}
      run_app_simulator: ${{ steps.plan.outputs.run_app_simulator }}
      run_release_build: ${{ steps.plan.outputs.run_release_build }}
      run_coverage: ${{ steps.plan.outputs.run_coverage }}
      coverage_packages: ${{ steps.plan.outputs.coverage_packages }}
      run_public_api: ${{ steps.plan.outputs.run_public_api }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute fail-closed CI plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != 'pull_request' ]; then
            python3 scripts/plan_ci_impact.py \
              --event-name "$EVENT_NAME" \
              --base-sha "$PR_BASE_SHA" \
              --head-sha "$PR_HEAD_SHA" \
              --checkout-sha "$CHECKOUT_SHA" \
              --github-output "$GITHUB_OUTPUT" \
              --summary-file "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$PR_BASE_SHA" ] || [ -z "$PR_HEAD_SHA" ] || [ -z "$CHECKOUT_SHA" ]; then
            echo 'Pull-request planning requires exact base, head, and checkout SHAs.' >&2
            exit 1
          fi
          git cat-file -e "$PR_BASE_SHA^{commit}"
          git cat-file -e "$PR_HEAD_SHA^{commit}"
          git cat-file -e "$CHECKOUT_SHA^{commit}"

          set -- $(git rev-list --parents -n 1 "$CHECKOUT_SHA")
          if [ "$#" -ne 3 ] || [ "$2" != "$PR_BASE_SHA" ] || [ "$3" != "$PR_HEAD_SHA" ]; then
            echo 'The checked-out pull-request commit is not the exact synthetic merge of event base and head.' >&2
            exit 1
          fi

          trusted_planner="$RUNNER_TEMP/plan_ci_impact.py"
          trusted_config="$RUNNER_TEMP/architecture-boundaries.json"
          planner_entry=$(git ls-tree "$PR_BASE_SHA" -- scripts/plan_ci_impact.py)

          if [ -z "$planner_entry" ]; then
            package_matrix='[{"package":"StreamingTextKit","path":"Packages/StreamingTextKit"},{"package":"VoiceChatDomain","path":"Packages/VoiceChatDomain"},{"package":"VoiceActivityDetectionKit","path":"Packages/VoiceActivityDetectionKit"},{"package":"SingleGreenGlassesKit","path":"Packages/SingleGreenGlassesKit"},{"package":"SingleGreenConversationAdapters","path":"Packages/SingleGreenConversationAdapters"},{"package":"LLMKit","path":"Packages/LLMKit"},{"package":"VoiceChatCore","path":"Packages/VoiceChatCore"}]'
            coverage_packages='["StreamingTextKit","VoiceChatDomain","VoiceActivityDetectionKit","SingleGreenGlassesKit","SingleGreenConversationAdapters","LLMKit","VoiceChatCore"]'
            {
              printf '%s\n' 'full=true'
              printf '%s\n' 'run_packages=true'
              printf '%s\n' "package_matrix=$package_matrix"
              printf '%s\n' 'run_app_simulator=true'
              printf '%s\n' 'run_release_build=true'
              printf '%s\n' 'run_coverage=true'
              printf '%s\n' "coverage_packages=$coverage_packages"
              printf '%s\n' 'run_public_api=true'
              printf '%s\n' 'reason=trusted_base_planner_unavailable'
            } >> "$GITHUB_OUTPUT"
            {
              printf '%s\n' '### CI impact plan'
              printf '%s\n' ''
              printf '%s\n' '- Mode: `full`'
              printf '%s\n' '- Full fallback: `true`'
              printf '%s\n' '- Reason: `trusted_base_planner_unavailable`'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          planner_type=$(printf '%s\n' "$planner_entry" | awk 'NR == 1 { print $2 }')
          if [ "$planner_type" != 'blob' ]; then
            echo 'Trusted-base CI planner path is not a file.' >&2
            exit 1
          fi
          config_entry=$(git ls-tree "$PR_BASE_SHA" -- config/architecture-boundaries.json)
          config_type=$(printf '%s\n' "$config_entry" | awk 'NR == 1 { print $2 }')
          if [ "$config_type" != 'blob' ]; then
            echo 'Trusted-base architecture boundary config is missing or invalid.' >&2
            exit 1
          fi

          git show "$PR_BASE_SHA:scripts/plan_ci_impact.py" > "$trusted_planner"
          git show "$PR_BASE_SHA:config/architecture-boundaries.json" > "$trusted_config"
          python3 "$trusted_planner" \
            --event-name "$EVENT_NAME" \
            --repository-root "$GITHUB_WORKSPACE" \
            --config-path "$trusted_config" \
            --base-sha "$PR_BASE_SHA" \
            --head-sha "$PR_HEAD_SHA" \
            --checkout-sha "$CHECKOUT_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  branch-contract:
    name: Branch contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run branch-policy fixtures
        run: scripts/test_internal_branch_policy.sh
      - name: Run ruleset-contract fixtures
        run: scripts/test_internal_ruleset_contract.sh
      - name: Reject pull requests targeting the delivery pointer
        if: github.event_name == 'pull_request' && github.base_ref == 'codex/internal-debug'
        run: |
          echo "Pull requests must target main; codex/internal-debug is a zero-delta delivery pointer." >&2
          exit 1
      - name: Verify internal delivery pointer
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/internal-debug'
        run: |
          set -eu
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          main_sha=$(git rev-parse 'refs/remotes/origin/main^{commit}')
          reviewed_main_sha='${{ github.event.after }}'
          internal_sha="$GITHUB_SHA"
          if [ "$internal_sha" != "$reviewed_main_sha" ]; then
            echo "GITHUB_SHA must equal the trusted push event after SHA." >&2
            exit 1
          fi
          scripts/check_internal_branch_policy.sh "$reviewed_main_sha" "$main_sha" "$internal_sha"
      - name: Verify manual internal certification pointer
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          if [ "$GITHUB_REF" != 'refs/heads/codex/internal-debug' ]; then
            echo 'Manual full internal certification must run at the internal delivery pointer.' >&2
            exit 1
          fi
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/codex/internal-debug:refs/remotes/origin/codex/internal-debug'
          main_sha=$(git rev-parse 'refs/remotes/origin/main^{commit}')
          internal_sha=$(git rev-parse 'refs/remotes/origin/codex/internal-debug^{commit}')
          if [ "$GITHUB_SHA" != "$main_sha" ] || [ "$GITHUB_SHA" != "$internal_sha" ]; then
            echo 'Manual checkout, current main, and internal pointer must be identical.' >&2
            exit 1
          fi
          scripts/check_internal_branch_policy.sh "$main_sha" "$main_sha" "$internal_sha"

  repository-hygiene:
    name: Repository hygiene
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check_toolchain.sh
      - run: scripts/check_repository_hygiene.sh
      - run: scripts/check_package_inventory.sh
      - run: scripts/check_architecture_boundaries.sh
      - run: scripts/test_architecture_boundaries.sh
      - run: scripts/check_build_documentation.sh
      - run: scripts/test_build_documentation_check.sh
      - run: scripts/scan_secrets.sh
      - run: scripts/test_repository_checks.sh
      - run: scripts/test_build_flavor_checks.sh
      - run: scripts/check_ci_workflow.sh
      - run: scripts/test_ci_workflow_check.sh
      - run: scripts/test_ci_impact_plan.sh
      - run: scripts/test_coverage_scope.sh
      - run: scripts/test_coverage_gate_selection.sh
      - run: scripts/check_privacy_logging.sh
      - run: scripts/check_vad_privacy.sh
      - run: scripts/check_vad_documentation_state.sh
      - run: scripts/test_release_evidence_validator.sh
      - run: scripts/test_simulator_destination.sh

  package-matrix:
    name: Package / ${{ matrix.package }}
    needs:
      - impact-plan
      - branch-contract
    if: needs.impact-plan.result == 'success' && needs.branch-contract.result == 'success' && needs.impact-plan.outputs.run_packages == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.impact-plan.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check_toolchain.sh
      - run: swift test --package-path "${{ matrix.path }}" -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Build aggregate-only VAD benchmark
        if: matrix.package == 'VoiceActivityDetectionKit'
        run: swift build --package-path Packages/VoiceActivityDetectionKit --product VADBenchmark -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Build privacy-safe ASRCLI
        if: matrix.package == 'VoiceChatCore'
        run: swift build --package-path Packages/VoiceChatCore --product ASRCLI -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  app-simulator:
    name: App simulator / ${{ matrix.variant }}
    needs:
      - impact-plan
      - branch-contract
    if: needs.impact-plan.result == 'success' && needs.branch-contract.result == 'success' && needs.impact-plan.outputs.run_app_simulator == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: user, scheme: SingleGreenUser, configuration: User-Debug, artifact_suffix: user-debug }
          - { variant: internal, scheme: SingleGreenInternal, configuration: Internal-Debug, artifact_suffix: internal-debug }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check_toolchain.sh
      - name: Resolve Simulator and run App tests
        run: |
          set -o pipefail
          xcodebuild -project SingleGreenDemo.xcodeproj -scheme "${{ matrix.scheme }}" -showdestinations
          simulator_udid=$(scripts/resolve_simulator_destination.sh)
          xcodebuild -project SingleGreenDemo.xcodeproj -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.configuration }}" \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$RUNNER_TEMP/SingleGreenDemo-${{ matrix.artifact_suffix }}" \
            -resultBundlePath "$RUNNER_TEMP/SingleGreenDemo-${{ matrix.artifact_suffix }}.xcresult" \
            test -only-testing:SingleGreenDemoTests \
            SWIFT_STRICT_CONCURRENCY=complete
      - name: Build App-only Debug artifact
        run: |
          set -o pipefail
          xcodebuild -project SingleGreenDemo.xcodeproj -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.configuration }}" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SingleGreenDemo-${{ matrix.artifact_suffix }}-artifact" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete build
      - name: Scan User Debug App
        if: matrix.variant == 'user'
        run: scripts/check_user_artifact_isolation.sh "$RUNNER_TEMP/SingleGreenDemo-${{ matrix.artifact_suffix }}-artifact/Build/Products/${{ matrix.configuration }}-iphonesimulator/SingleGreenDemo.app"
      - name: Scan Internal Debug App
        if: matrix.variant == 'internal'
        run: scripts/check_internal_artifact_capabilities.sh "$RUNNER_TEMP/SingleGreenDemo-${{ matrix.artifact_suffix }}-artifact/Build/Products/${{ matrix.configuration }}-iphonesimulator/SingleGreenDemo.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: app-simulator-${{ matrix.artifact_suffix }}-xcresult
          path: ${{ runner.temp }}/SingleGreenDemo-${{ matrix.artifact_suffix }}.xcresult
          if-no-files-found: warn

  release-build:
    name: Release build / ${{ matrix.variant }}
    needs:
      - impact-plan
      - branch-contract
    if: needs.impact-plan.result == 'success' && needs.branch-contract.result == 'success' && needs.impact-plan.outputs.run_release_build == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: user, scheme: SingleGreenUser, configuration: User-Release, artifact_suffix: user-release }
          - { variant: internal, scheme: SingleGreenInternal, configuration: Internal-Release, artifact_suffix: internal-release }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check_toolchain.sh
      - name: Build universal generic Simulator App
        run: |
          set -o pipefail
          xcodebuild -project SingleGreenDemo.xcodeproj -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.configuration }}" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SingleGreenDemo-${{ matrix.artifact_suffix }}" \
            -resultBundlePath "$RUNNER_TEMP/SingleGreenDemo-${{ matrix.artifact_suffix }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            ONLY_ACTIVE_ARCH=NO \
            'ARCHS=arm64 x86_64' build
      - name: Scan User Release App
        if: matrix.variant == 'user'
        run: scripts/check_user_artifact_isolation.sh "$RUNNER_TEMP/SingleGreenDemo-${{ matrix.artifact_suffix }}/Build/Products/${{ matrix.configuration }}-iphonesimulator/SingleGreenDemo.app"
      - name: Scan Internal Release App
        if: matrix.variant == 'internal'
        run: scripts/check_internal_artifact_capabilities.sh "$RUNNER_TEMP/SingleGreenDemo-${{ matrix.artifact_suffix }}/Build/Products/${{ matrix.configuration }}-iphonesimulator/SingleGreenDemo.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-${{ matrix.artifact_suffix }}-xcresult
          path: ${{ runner.temp }}/SingleGreenDemo-${{ matrix.artifact_suffix }}.xcresult
          if-no-files-found: warn

  coverage:
    name: Package coverage
    needs:
      - impact-plan
      - branch-contract
    if: needs.impact-plan.result == 'success' && needs.branch-contract.result == 'success' && needs.impact-plan.outputs.run_coverage == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check_toolchain.sh
      - name: Run selected coverage gates
        env:
          COVERAGE_PACKAGES_JSON: ${{ needs.impact-plan.outputs.coverage_packages }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$COVERAGE_PACKAGES_JSON" | jq -e \
            'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' >/dev/null; then
            echo 'Coverage package plan must be a non-empty JSON array of package names.' >&2
            exit 1
          fi
          coverage_packages=()
          while IFS= read -r package; do
            coverage_packages+=("$package")
          done < <(printf '%s' "$COVERAGE_PACKAGES_JSON" | jq -r '.[]')
          scripts/coverage_gate.sh "$RUNNER_TEMP/coverage" "${coverage_packages[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: package-coverage
          path: |
            ${{ runner.temp }}/coverage/summary.tsv
            ${{ runner.temp }}/coverage/*.txt
          if-no-files-found: warn
          retention-days: 14

  public-api:
    name: Reviewed public API baselines
    needs:
      - impact-plan
      - branch-contract
    if: needs.impact-plan.result == 'success' && needs.branch-contract.result == 'success' && needs.impact-plan.outputs.run_public_api == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check_toolchain.sh
      - run: scripts/test_public_api_baselines.sh
      - run: scripts/test_public_api_baseline_update.sh
      - run: scripts/check_public_api_baselines.sh

  required-ci:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual Full Internal Certification' || 'Required CI' }}
    if: always()
    needs:
      - impact-plan
      - branch-contract
      - repository-hygiene
      - package-matrix
      - app-simulator
      - release-build
      - coverage
      - public-api
    runs-on: ubuntu-latest
    steps:
      - name: Require the exact planned CI result
        env:
          FULL: ${{ needs.impact-plan.outputs.full }}
          IMPACT_PLAN_RESULT: ${{ needs.impact-plan.result }}
          BRANCH_CONTRACT_RESULT: ${{ needs.branch-contract.result }}
          REPOSITORY_HYGIENE_RESULT: ${{ needs.repository-hygiene.result }}
          RUN_PACKAGES: ${{ needs.impact-plan.outputs.run_packages }}
          PACKAGE_MATRIX_RESULT: ${{ needs.package-matrix.result }}
          RUN_APP_SIMULATOR: ${{ needs.impact-plan.outputs.run_app_simulator }}
          APP_SIMULATOR_RESULT: ${{ needs.app-simulator.result }}
          RUN_RELEASE_BUILD: ${{ needs.impact-plan.outputs.run_release_build }}
          RELEASE_BUILD_RESULT: ${{ needs.release-build.result }}
          RUN_COVERAGE: ${{ needs.impact-plan.outputs.run_coverage }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RUN_PUBLIC_API: ${{ needs.impact-plan.outputs.run_public_api }}
          PUBLIC_API_RESULT: ${{ needs.public-api.result }}
        run: |
          set -eu

          require_success() {
            label=$1
            result=$2
            if [ "$result" != 'success' ]; then
              echo "$label must succeed, got: $result" >&2
              exit 1
            fi
          }

          require_planned_result() {
            label=$1
            decision=$2
            result=$3
            case "$decision" in
              true)
                if [ "$result" != 'success' ]; then
                  echo "$label was planned and must succeed, got: $result" >&2
                  exit 1
                fi
                ;;
              false)
                if [ "$result" != 'skipped' ]; then
                  echo "$label was not planned and must be skipped, got: $result" >&2
                  exit 1
                fi
                ;;
              *)
                echo "$label has an invalid planner decision: $decision" >&2
                exit 1
                ;;
            esac
          }

          require_success 'Impact plan' "$IMPACT_PLAN_RESULT"
          require_success 'Branch contract' "$BRANCH_CONTRACT_RESULT"
          require_success 'Repository hygiene' "$REPOSITORY_HYGIENE_RESULT"

          case "$FULL" in
            true|false) ;;
            *)
              echo "Planner full output must be true or false, got: $FULL" >&2
              exit 1
              ;;
          esac

          if [ "$FULL" = 'true' ]; then
            for decision in \
              "$RUN_PACKAGES" \
              "$RUN_APP_SIMULATOR" \
              "$RUN_RELEASE_BUILD" \
              "$RUN_COVERAGE" \
              "$RUN_PUBLIC_API"
            do
              if [ "$decision" != 'true' ]; then
                echo 'A full CI plan must enable every selective job.' >&2
                exit 1
              fi
            done
          fi

          require_planned_result 'Package matrix' "$RUN_PACKAGES" "$PACKAGE_MATRIX_RESULT"
          require_planned_result 'App simulator' "$RUN_APP_SIMULATOR" "$APP_SIMULATOR_RESULT"
          require_planned_result 'Release build' "$RUN_RELEASE_BUILD" "$RELEASE_BUILD_RESULT"
          require_planned_result 'Coverage' "$RUN_COVERAGE" "$COVERAGE_RESULT"
          require_planned_result 'Public API' "$RUN_PUBLIC_API" "$PUBLIC_API_RESULT"
